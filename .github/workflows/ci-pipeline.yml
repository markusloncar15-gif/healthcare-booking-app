name: CI Pipeline

on:
  push:
    branches:
      - main
      - feature-login-page
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check index.html exists
        run: |
          echo "Checking index.html file..."
          test -f index.html

      - name: Check style.css exists
        run: |
          echo "Checking style.css file..."
          test -f style.css

      - name: Simulate tests
        run: |
          echo "Running automated tests..."
          echo "All tests passed successfully."
